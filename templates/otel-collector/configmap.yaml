apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: university-monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    connectors:
      # Graphe de dépendances service-à-service généré depuis les traces
      servicegraph:
        latency_histogram_buckets: [1ms, 2ms, 6ms, 10ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - http.method
          - http.status_code
        store:
          ttl: 2s
          max_items: 1000

      # Métriques RED (Rate, Error, Duration) par service depuis les traces
      spanmetrics:
        namespace: traces
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 25ms, 50ms, 75ms, 100ms, 250ms, 500ms, 750ms, 1s, 2s, 5s, 10s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.route
          - name: service.name
        exemplars:
          enabled: true

    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

    exporters:
      # Traces → Tempo (OTLP gRPC)
      otlp/tempo:
        endpoint: tempo.{{ .Values.namespace }}.svc.cluster.local:4317
        tls:
          insecure: true

      # Métriques spanmetrics + servicegraph → exposées en pull pour Prometheus
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        resource_to_telemetry_conversion:
          enabled: true

      debug:
        verbosity: basic

    service:
      pipelines:
        # Pipeline traces : reçoit → traite → envoie vers Tempo ET les connecteurs
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, spanmetrics, servicegraph]

        # Pipeline métriques : les connecteurs génèrent → exposées à Prometheus
        metrics:
          receivers: [spanmetrics, servicegraph]
          processors: [batch]
          exporters: [prometheus]
